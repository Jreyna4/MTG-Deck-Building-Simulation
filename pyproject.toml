[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mtgsim"
version = "0.1.0"
description = "Commander deck simulator: opening hands, mulligans, combos and matchups"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "JoeR" }]
dependencies = []

[project.optional-dependencies]
app = ["streamlit>=1.50"]
dev = ["pytest>=7"]

[project.scripts]
mtgsim = "mtgsim.cli:main"

[tool.setuptools]
packages = ["mtgsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
